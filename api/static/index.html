<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AetherOS</title>
<style>
  :root { --bg:#fff; --panel:#f5f6f8; --text:#1b1f24; --muted:#6b7280; --accent:#0e7490; --bd:#d8dce2; --bad:#b91c1c; --good:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1419; --panel:#171d24; --text:#e6e9ee; --muted:#8b95a3; --accent:#22b8d8; --bd:#2a323c; --bad:#f87171; --good:#4ade80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--bd); display:flex; gap:12px; align-items:baseline; }
  header h1 { margin:0; font-size:17px; } header span { color:var(--muted); font-size:13px; }
  main { flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0; }
  @media (max-width:760px){ main{grid-template-columns:1fr;} aside{display:none;} }
  #chat { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:9px 13px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .ai { align-self:flex-start; background:var(--panel); border:1px solid var(--bd); }
  .err { color:var(--bad); } .sys { align-self:center; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--bd); }
  input[type=text], select { flex:1; padding:9px 11px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  select { flex:0 0 auto; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--bd); }
  button:disabled { opacity:.5; cursor:wait; }
  aside { border-left:1px solid var(--bd); padding:14px; overflow-y:auto; background:var(--panel); }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  aside h2:first-child { margin-top:0; }
  .task { display:flex; gap:6px; align-items:center; padding:4px 0; font-size:14px; }
  .task span { flex:1; } .task button { padding:2px 8px; font-size:12px; }
  .plan { align-self:stretch; border:1px solid var(--accent); border-radius:10px; padding:12px; }
  .plan label { display:flex; gap:8px; margin:6px 0; } .plan input[type=text] { padding:5px 8px; }
  .plan .row { display:flex; gap:8px; margin-top:10px; }
  .alert { color:var(--bad); font-size:14px; } .ok { color:var(--good); font-size:14px; }
</style>
</head>
<body>
<header><h1>AetherOS</h1><span id="specs">…</span></header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <select id="mode"><option value="chat">Chat</option><option value="plan">Plan</option></select>
      <input type="text" id="input" placeholder="Ask AetherOS…" autocomplete="off" autofocus>
      <button id="send">Send</button>
    </form>
  </section>
  <aside>
    <h2>Alerts</h2><div id="alerts"></div>
    <h2>Tasks</h2><div id="tasks"></div>
    <form id="taskform" style="padding:8px 0 0;border:0">
      <input type="text" id="taskinput" placeholder="New task…"><button>Add</button>
    </form>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("aether_token") || "";

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["X-API-Token"] = token;
  let res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    token = prompt("API token:") || "";
    sessionStorage.setItem("aether_token", token);
    headers["X-API-Token"] = token;
    res = await fetch(path, { ...opts, headers });
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;           // textContent: model output is never parsed as HTML
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

async function refresh() {
  try {
    const s = await api("/api/status");
    $("specs").textContent = s.specs;
    $("alerts").innerHTML = "";
    const a = document.createElement("div");
    a.className = s.alerts.length ? "alert" : "ok";
    a.textContent = s.alerts.length ? s.alerts.join("\n") : "✔ All services healthy";
    $("alerts").appendChild(a);
    $("tasks").innerHTML = "";
    if (!s.tasks.length) $("tasks").textContent = "No pending tasks.";
    s.tasks.forEach(t => {
      const id = t.match(/^#(\d+)/)[1];
      const row = document.createElement("div"); row.className = "task";
      const label = document.createElement("span"); label.textContent = t.replace(/^#\d+ /, "");
      const done = document.createElement("button"); done.className = "ghost"; done.textContent = "Done";
      done.onclick = async () => { await api(`/api/tasks/${id}/complete`, { method: "POST" }); refresh(); };
      const del = document.createElement("button"); del.className = "ghost"; del.textContent = "✕";
      del.onclick = async () => { await api(`/api/tasks/${id}`, { method: "DELETE" }); refresh(); };
      row.append(label, done, del); $("tasks").appendChild(row);
    });
  } catch (e) { $("specs").textContent = "Status unavailable: " + e.message; }
}

function showPlan(goal, steps) {
  const box = document.createElement("div"); box.className = "plan";
  const title = document.createElement("div"); title.textContent = "Proposed plan — edit, untick to skip, then run:";
  box.appendChild(title);
  const rows = steps.map(s => {
    const l = document.createElement("label");
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = true;
    const t = document.createElement("input"); t.type = "text"; t.value = s;
    l.append(c, t); box.appendChild(l); return { c, t };
  });
  const row = document.createElement("div"); row.className = "row";
  const run = document.createElement("button"); run.textContent = "Run plan";
  const cancel = document.createElement("button"); cancel.className = "ghost"; cancel.textContent = "Cancel";
  cancel.onclick = () => box.remove();
  run.onclick = async () => {
    const chosen = rows.filter(r => r.c.checked && r.t.value.trim()).map(r => r.t.value.trim());
    if (!chosen.length) return;
    run.disabled = cancel.disabled = true; run.textContent = "Running…";
    try {
      const out = await api("/api/agent/run", { method: "POST", body: JSON.stringify({ goal, steps: chosen }) });
      box.remove();
      out.steps.forEach(s => add((s.ok ? "✔ " : "✘ ") + s.step, "sys"));
      add(out.summary, "ai");
    } catch (e) { add(e.message, "ai err"); box.remove(); }
    refresh();
  };
  row.append(run, cancel); box.appendChild(row);
  $("log").appendChild(box); $("log").scrollTop = $("log").scrollHeight;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = ""; add(text, "user");
  $("send").disabled = true;
  const wait = add("…", "ai");
  try {
    if ($("mode").value === "plan") {
      const out = await api("/api/agent/plan", { method: "POST", body: JSON.stringify({ goal: text }) });
      wait.remove(); showPlan(out.goal, out.steps);
    } else {
      const out = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
      wait.textContent = out.reply || "(no reply)";
      if (out.tool_failed) add("A tool call failed during this request.", "sys");
    }
  } catch (err) { wait.textContent = err.message; wait.classList.add("err"); }
  $("send").disabled = false; $("input").focus(); refresh();
};

$("taskform").onsubmit = async e => {
  e.preventDefault();
  const t = $("taskinput").value.trim(); if (!t) return;
  $("taskinput").value = "";
  try { await api("/api/tasks", { method: "POST", body: JSON.stringify({ task: t }) }); } catch (err) { add(err.message, "ai err"); }
  refresh();
};

refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
